
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Cleaning - Instant Quote</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #1a1a1a; margin-bottom: 10px; }
        .quote-box {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            min-height: 100px;
        }
        button {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            background: #007AFF;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active { background: #0051D5; }
        .secondary {
            background: #34C759;
            margin-top: 12px;
        }
        .secondary:active { background: #248A3D; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vision Cleaning Services</h1>
        <p>Get your instant quote below:</p>
        
        <div class="quote-box" id="quoteBox">
            Your custom cleaning quote will appear here.
        </div>

        <button onclick="copyQuote()">Copy Quote</button>
        <button class="secondary" onclick="textToBook()">Text to Book</button>
    </div>

    <script>
        // Replace this with your actual quote generation logic
        document.getElementById('quoteBox').innerText = '2 Bed / 2 Bath Deep Clean - $180\nIncludes: Kitchen, bathrooms, floors, dusting, baseboards';

        function copyQuote() {
            const quoteText = document.getElementById('quoteBox').innerText;
            navigator.clipboard.writeText(quoteText).then(() => {
                alert('Quote copied! Paste it in a text to book.');
            });
        }

        const phone = "6024868993";

        function textToBook() {
            const quoteText = document.getElementById('quoteBox').innerText || 'New quote request';
            const message = `Hi Vision Cleaning, I'd like to book:\n\n${quoteText}`;
            window.location.href = `sms:${phone}&body=${encodeURIComponent(message)}`;
        }
    </script>
</body>
</html>
