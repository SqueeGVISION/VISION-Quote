<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VISION | Booking + Quote Prototype</title>
  <meta name="description" content="Expanded VISION window cleaning social web app with client details, address capture, calendar self-booking, service selections, and SMS-ready booking summary." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --text-xs: clamp(.75rem,.7rem + .25vw,.875rem);
      --text-sm: clamp(.875rem,.8rem + .35vw,1rem);
      --text-base: clamp(1rem,.95rem + .25vw,1.125rem);
      --text-lg: clamp(1.125rem,1rem + .75vw,1.45rem);
      --text-xl: clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
      --space-1:.25rem; --space-2:.5rem; --space-3:.75rem; --space-4:1rem; --space-5:1.25rem; --space-6:1.5rem; --space-8:2rem; --space-10:2.5rem; --space-12:3rem;
      --radius-sm:.5rem; --radius-md:.875rem; --radius-lg:1.15rem; --radius-xl:1.5rem; --radius-full:999px;
      --color-bg:#f6f8fc; --color-surface:#ffffff; --color-surface-2:#eef5ff; --color-surface-3:#fff5ec; --color-border:rgba(11,30,52,.10);
      --color-text:#102033; --color-text-muted:#5b6b82; --color-primary:#eb6a12; --color-primary-hover:#c85305; --color-secondary:#0f4b80; --color-secondary-soft:#e8f2ff; --color-success:#1e8a57;
      --shadow-sm:0 8px 18px rgba(10,28,46,.06); --shadow-md:0 18px 40px rgba(10,28,46,.10);
      --font-body:'Inter',system-ui,sans-serif; --transition:180ms cubic-bezier(.16,1,.3,1);
    }
    [data-theme="dark"] {
      --color-bg:#12171d; --color-surface:#192028; --color-surface-2:#132941; --color-surface-3:#2b1f17; --color-border:rgba(255,255,255,.10);
      --color-text:#eff3fa; --color-text-muted:#adc0d6; --color-secondary-soft:#12263a; --shadow-sm:0 8px 18px rgba(0,0,0,.22); --shadow-md:0 18px 40px rgba(0,0,0,.32);
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;min-height:100vh;font-family:var(--font-body);font-size:var(--text-base);line-height:1.55;color:var(--color-text);background:radial-gradient(circle at top,rgba(235,106,18,.10),transparent 24%),var(--color-bg)}
    a,button,input,select,textarea{font:inherit} img,svg{display:block;max-width:100%}
    .page{max-width:1240px;margin:0 auto;padding:var(--space-4)} .stack{display:grid;gap:var(--space-6)} .section-stack{display:grid;gap:var(--space-4)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);padding:var(--space-4) 0 var(--space-6)}
    .brand{display:flex;align-items:center;gap:var(--space-3)} .brand-mark{width:58px;height:58px;border-radius:18px;background:#fff;box-shadow:var(--shadow-md);display:grid;place-items:center;color:var(--color-primary);overflow:hidden;border:1px solid rgba(0,0,0,.08)} .brand-mark img{width:100%;height:100%;object-fit:cover} .qr-showcase{display:grid;gap:var(--space-4);justify-items:center;text-align:center;background:var(--color-surface-3);border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--space-5);margin-top:var(--space-5)} .qr-showcase img{width:220px;height:220px;border-radius:24px;background:#fff;padding:12px;box-shadow:var(--shadow-sm)} .qr-showcase small{color:var(--color-text-muted);display:block}
    .brand-copy h1{margin:0;font-size:var(--text-lg)} .brand-copy p{margin:.2rem 0 0;color:var(--color-text-muted);font-size:var(--text-sm)}
    .top-actions,.pill-row{display:flex;gap:.6rem;flex-wrap:wrap} .btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:0 .95rem;border-radius:var(--radius-full);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);text-decoration:none;cursor:pointer;transition:all var(--transition)}
    .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)} .btn-primary{background:var(--color-primary);color:#fff;border-color:transparent} .btn-primary:hover{background:var(--color-primary-hover)}
    .panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-xl);box-shadow:var(--shadow-md)} .hero{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6)}
    .hero-copy,.booking-card,.info-card,.code-card,.calendar-card{padding:var(--space-6)} .eyebrow{display:inline-flex;align-items:center;gap:.45rem;padding:.55rem .9rem;border-radius:var(--radius-full);background:var(--color-secondary-soft);color:var(--color-secondary);font-size:var(--text-sm);font-weight:700;margin-bottom:var(--space-4)}
    .headline{font-size:var(--text-xl);line-height:1.02;margin:0 0 var(--space-4)} .lead,.muted{color:var(--color-text-muted)} .stat-grid,.info-grid,.app-grid,.calendar-grid,.summary-grid{display:grid;gap:var(--space-4)} .stat-grid{grid-template-columns:repeat(3,1fr);margin-top:var(--space-5)}
    .info-grid{grid-template-columns:repeat(3,1fr)} .app-grid{grid-template-columns:1.2fr .8fr} .calendar-grid{grid-template-columns:1fr 320px} .summary-grid{grid-template-columns:repeat(2,1fr)}
    .stat-card,.mini-card,.slot,.summary-card,.day-card{background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-4)}
    .pill{padding:.45rem .75rem;border-radius:var(--radius-full);background:var(--color-surface-3);border:1px solid var(--color-border);font-size:var(--text-xs)}
    .section-title{margin:0 0 .35rem;font-size:var(--text-lg)} .section-text{margin:0 0 var(--space-4);color:var(--color-text-muted);font-size:var(--text-sm)}
    .grid-2,.grid-3{display:grid;gap:var(--space-4)} .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))} .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    label{display:block;font-size:var(--text-sm);font-weight:700;margin-bottom:.45rem} input,select,textarea{width:100%;min-height:48px;border-radius:1rem;border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);padding:.9rem 1rem} textarea{min-height:96px;resize:vertical}
    .check{display:flex;align-items:flex-start;gap:.75rem;padding:1rem;border-radius:1rem;background:var(--color-surface-2);border:1px solid var(--color-border)} .check input{width:auto;min-height:auto;margin-top:.2rem}
    .results,.day-list{display:grid;gap:.65rem;background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:1rem;padding:1rem} .result-row{display:flex;justify-content:space-between;gap:1rem;font-size:var(--text-sm)} .result-row.total{border-top:1px solid var(--color-border);padding-top:.8rem;margin-top:.2rem;font-size:var(--text-base);font-weight:800}
    .notice{margin-top:var(--space-4);padding:1rem;border-radius:1rem;background:rgba(30,138,87,.12);color:#0d5a37;font-size:var(--text-sm);display:none}
    .calendar-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:var(--space-4)} .calendar-month{font-weight:800} .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:.55rem}
    .dow,.day-btn{aspect-ratio:1/1;display:grid;place-items:center;border-radius:16px;font-size:var(--text-sm)} .dow{font-weight:700;color:var(--color-text-muted)} .day-btn{border:1px solid var(--color-border);background:var(--color-surface);cursor:pointer}
    .day-btn:hover{transform:translateY(-1px)} .day-btn.selected{background:var(--color-primary);border-color:transparent;color:#fff} .day-btn.blocked{background:#e4e8ef;color:#8b96a6;cursor:not-allowed}
    [data-theme="dark"] .day-btn.blocked{background:#242e3b;color:#728099} .slot{cursor:pointer;text-align:center} .slot.selected{background:var(--color-primary);color:#fff;border-color:transparent}
    .badge{display:inline-flex;align-items:center;padding:.28rem .6rem;border-radius:var(--radius-full);background:var(--color-secondary-soft);color:var(--color-secondary);font-size:var(--text-xs);font-weight:700}
    .phone-shell{max-width:320px;margin:0 auto;border:10px solid #0f1720;border-radius:32px;padding:12px;background:#0f1720;box-shadow:var(--shadow-md)} .phone-screen{background:#f8fbff;border-radius:22px;overflow:hidden} .phone-top{background:linear-gradient(135deg,#0f4b80,#2a77c4);color:#fff;padding:1rem} .phone-body{padding:1rem;display:grid;gap:.9rem}
    pre{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.45;background:#0f1720;color:#e5edf8;padding:1rem;border-radius:1rem;overflow:auto;max-height:520px}
    @media (max-width:1020px){.hero,.app-grid,.calendar-grid,.info-grid,.stat-grid,.summary-grid{grid-template-columns:1fr}.grid-2,.grid-3{grid-template-columns:1fr}}
  </style>
</head>
